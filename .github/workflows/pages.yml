name: Subir la web de Luna Cinema
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    name: Comprobar que funciona y subir la web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Comprobar que el formulario funciona
        run: |
          node --check backend/index.mjs
          node --check web/app.js
          node --test tests/backend.test.mjs
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Dejar los archivos listos para subir
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Subir la web a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
